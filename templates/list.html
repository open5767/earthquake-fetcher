{% extends "base.html" %}
{% block title %}事件列表{% endblock %}

{% block content %}
<!-- 数据源切换标签 -->
<div class="source-tabs">
    <button class="source-tab active" onclick="switchSource('all', this)">全部数据</button>
    <button class="source-tab" onclick="switchSource('cenc', this)">中国地震台网</button>
    <button class="source-tab" onclick="switchSource('usgs', this)">USGS</button>
</div>

<div class="panel">
    <div class="filter-bar">
        <div class="filter-row">
            <div class="form-group">
                <label>最小震级</label>
                <input type="number" id="filter-min-mag" value="0" min="0" max="9" step="0.1" onchange="doSearch()">
            </div>
            <div class="form-group">
                <label>最大震级</label>
                <input type="number" id="filter-max-mag" value="9" min="0" max="9" step="0.1" onchange="doSearch()">
            </div>
            <div class="form-group">
                <label>起始时间</label>
                <input type="date" id="filter-start" onchange="doSearch()">
            </div>
            <div class="form-group">
                <label>结束时间</label>
                <input type="date" id="filter-end" onchange="doSearch()">
            </div>
            <div class="form-group">
                <label>地点搜索</label>
                <input type="text" id="filter-place" placeholder="输入地名关键词..." oninput="doSearch()">
            </div>
        </div>
        <div class="filter-actions">
            <button class="btn btn-secondary btn-sm" onclick="resetFilters()">重置筛选</button>
            <span class="total-info">共 <strong id="total-count">0</strong> 条记录</span>
        </div>
    </div>
</div>

<div class="panel">
    <table class="table">
        <thead>
            <tr>
                <th><a href="#" onclick="setSort('time')">发震时刻 ▾</a></th>
                <th><a href="#" onclick="setSort('magnitude')">震级 ▾</a></th>
                <th>震级类型</th>
                <th><a href="#" onclick="setSort('depth_km')">深度(km) ▾</a></th>
                <th>参考位置</th>
                <th>经度</th>
                <th>纬度</th>
                <th>中国烈度</th>
                <th>数据来源</th>
                <th>类型</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="event-tbody"></tbody>
    </table>
    <div class="pagination" id="pagination"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    window.CURRENT_MODULE = 'earthquake';
    var currentPage = 1;
    var currentSort = 'time';
    var currentSortDir = 'desc';
    var currentSource = 'all';

    function switchSource(src, el) {
        currentSource = src;
        document.querySelectorAll('.source-tab').forEach(function(t) { t.classList.remove('active'); });
        if (el) el.classList.add('active');
        doSearch(1);
    }

    async function doSearch(page) {
        if (page) currentPage = page;
        var params = new URLSearchParams({
            page: currentPage,
            per_page: 20,
            sort_by: currentSort,
            sort_dir: currentSortDir,
        });
        var minMag = document.getElementById('filter-min-mag').value;
        var maxMag = document.getElementById('filter-max-mag').value;
        var start = document.getElementById('filter-start').value;
        var end = document.getElementById('filter-end').value;
        var place = document.getElementById('filter-place').value;
        if (minMag) params.set('min_mag', minMag);
        if (maxMag) params.set('max_mag', maxMag);
        if (start) params.set('start_time', start);
        if (end) params.set('end_time', end);
        if (place) params.set('place', place);
        if (currentSource !== 'all') params.set('source', currentSource);

        var resp = await fetch('/api/eq/events?' + params);
        var data = await resp.json();

        document.getElementById('total-count').textContent = data.total;

        document.getElementById('event-tbody').innerHTML = data.data.map(function(e) {
            var srcBadge = e.source === 'cenc'
                ? '<span class="badge badge-src-cenc">中国地震台网</span>'
                : '<span class="badge badge-src-usgs">USGS</span>';
            var eventTypeHtml = e.event_type
                ? '<span class="badge badge-event-type ' + (e.event_type === '正式测定' ? 'badge-review' : 'badge-auto') + '">' + e.event_type + '</span>'
                : '-';
            var intensityHtml = e.intensity_label
                ? '<span class="intensity-tag int-' + e.intensity + '">' + e.intensity_label + '</span>'
                : '-';
            return '<tr>' +
                '<td>' + (e.time||'').slice(0,19) + '</td>' +
                '<td><span class="badge badge-m' + Math.floor(e.magnitude) + '">M' + e.magnitude + '</span></td>' +
                '<td>' + (e.mag_type || '-') + '</td>' +
                '<td>' + e.depth_km + '</td>' +
                '<td><a href="/earthquake/' + encodeURIComponent(e.event_id) + '">' + (e.place || '未知') + '</a></td>' +
                '<td>' + (e.longitude ? e.longitude.toFixed(2) : '-') + '</td>' +
                '<td>' + (e.latitude ? e.latitude.toFixed(2) : '-') + '</td>' +
                '<td>' + intensityHtml + '</td>' +
                '<td>' + srcBadge + '</td>' +
                '<td>' + eventTypeHtml + '</td>' +
                '<td><button class="btn btn-xs btn-danger" onclick="deleteEvent(\'' + e.event_id + '\')">删除</button></td>' +
                '</tr>';
        }).join('');

        // 分页
        var pageHtml = '';
        for (var i = 1; i <= data.total_pages; i++) {
            pageHtml += '<button class="btn btn-xs ' + (i === data.page ? 'btn-primary' : 'btn-secondary') +
                        '" onclick="doSearch(' + i + ')">' + i + '</button>';
        }
        document.getElementById('pagination').innerHTML = pageHtml;
    }

    function setSort(field) {
        if (currentSort === field) {
            currentSortDir = currentSortDir === 'desc' ? 'asc' : 'desc';
        } else {
            currentSort = field;
            currentSortDir = 'desc';
        }
        doSearch(1);
    }

    function resetFilters() {
        document.getElementById('filter-min-mag').value = '0';
        document.getElementById('filter-max-mag').value = '9';
        document.getElementById('filter-start').value = '';
        document.getElementById('filter-end').value = '';
        document.getElementById('filter-place').value = '';
        doSearch(1);
    }

    async function deleteEvent(eventId) {
        if (!confirm('确认删除此地震事件?')) return;
        var resp = await fetch('/api/eq/events/' + encodeURIComponent(eventId), {method: 'DELETE'});
        var r = await resp.json();
        if (r.ok) doSearch(currentPage);
    }

    doSearch(1);
</script>
{% endblock %}
