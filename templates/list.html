{% extends "base.html" %}
{% block title %}事件列表 - 地震数据管理{% endblock %}

{% block content %}
<div class="panel">
    <div class="filter-bar">
        <div class="filter-row">
            <div class="form-group">
                <label>最小震级</label>
                <input type="number" id="filter-min-mag" value="0" min="0" max="9" step="0.1" onchange="doSearch()">
            </div>
            <div class="form-group">
                <label>最大震级</label>
                <input type="number" id="filter-max-mag" value="9" min="0" max="9" step="0.1" onchange="doSearch()">
            </div>
            <div class="form-group">
                <label>起始时间</label>
                <input type="date" id="filter-start" onchange="doSearch()">
            </div>
            <div class="form-group">
                <label>结束时间</label>
                <input type="date" id="filter-end" onchange="doSearch()">
            </div>
            <div class="form-group">
                <label>地点搜索</label>
                <input type="text" id="filter-place" placeholder="输入地名..." oninput="doSearch()">
            </div>
        </div>
        <div class="filter-actions">
            <button class="btn btn-secondary btn-sm" onclick="resetFilters()">重置</button>
            <span class="total-info">共 <strong id="total-count">0</strong> 条记录</span>
        </div>
    </div>
</div>

<div class="panel">
    <table class="table">
        <thead>
            <tr>
                <th><a href="#" onclick="setSort('time')">时间 ▾</a></th>
                <th><a href="#" onclick="setSort('magnitude')">震级 ▾</a></th>
                <th>震级类型</th>
                <th><a href="#" onclick="setSort('depth_km')">深度 (km) ▾</a></th>
                <th>地点</th>
                <th>经度</th>
                <th>纬度</th>
                <th><a href="#" onclick="setSort('significance')">显著性 ▾</a></th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="event-tbody"></tbody>
    </table>

    <div class="pagination" id="pagination"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let currentPage = 1;
    let currentSort = 'time';
    let currentSortDir = 'desc';

    async function doSearch(page = 1) {
        currentPage = page;
        const params = new URLSearchParams({
            page: page,
            per_page: 20,
            sort_by: currentSort,
            sort_dir: currentSortDir,
            min_mag: document.getElementById('filter-min-mag').value || '',
            max_mag: document.getElementById('filter-max-mag').value || '',
            start_time: document.getElementById('filter-start').value || '',
            end_time: document.getElementById('filter-end').value || '',
            place: document.getElementById('filter-place').value || '',
        });

        const resp = await fetch('/api/events?' + params);
        const data = await resp.json();

        document.getElementById('total-count').textContent = data.total;

        document.getElementById('event-tbody').innerHTML = data.data.map(e => `
            <tr>
                <td>${e.time.slice(0, 19)}</td>
                <td><span class="badge badge-m${Math.floor(e.magnitude)}">M${e.magnitude}</span></td>
                <td>${e.mag_type}</td>
                <td>${e.depth_km}</td>
                <td><a href="/events/${e.event_id}">${e.place}</a></td>
                <td>${e.longitude.toFixed(3)}</td>
                <td>${e.latitude.toFixed(3)}</td>
                <td>${e.significance}</td>
                <td><button class="btn btn-xs btn-danger" onclick="deleteEvent('${e.event_id}')">删除</button></td>
            </tr>
        `).join('');

        // 分页
        let pageHtml = '';
        for (let i = 1; i <= data.total_pages; i++) {
            pageHtml += `<button class="btn btn-xs ${i === data.page ? 'btn-primary' : 'btn-secondary'}"
                               onclick="doSearch(${i})">${i}</button>`;
        }
        document.getElementById('pagination').innerHTML = pageHtml;
    }

    function setSort(field) {
        if (currentSort === field) {
            currentSortDir = currentSortDir === 'desc' ? 'asc' : 'desc';
        } else {
            currentSort = field;
            currentSortDir = 'desc';
        }
        doSearch(currentPage);
    }

    function resetFilters() {
        document.getElementById('filter-min-mag').value = '0';
        document.getElementById('filter-max-mag').value = '9';
        document.getElementById('filter-start').value = '';
        document.getElementById('filter-end').value = '';
        document.getElementById('filter-place').value = '';
        doSearch(1);
    }

    async function deleteEvent(eventId) {
        if (!confirm('确认删除此事件?')) return;
        const resp = await fetch('/api/events/' + eventId, {method: 'DELETE'});
        const r = await resp.json();
        if (r.ok) doSearch(currentPage);
    }

    doSearch(1);
</script>
{% endblock %}
